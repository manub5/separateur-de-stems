[project]
name = "separateur-de-stems"
version = "0.1.0"
description = "Desktop audio stem separator using audio-separator"
requires-python = ">=3.12"
dependencies = [
    "audio-separator",
    "soundfile",
    "PySide6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[project.scripts]
separateur-de-stems = "separateur_de_stems.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["separateur_de_stems*"]
