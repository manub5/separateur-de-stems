name: Build macOS (Apple Silicon)

# Manual runs and version tags.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build unsigned .app on macos-14 (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # ffmpeg is bundled into the .app by packaging/stem-separator.spec,
      # which resolves it with shutil.which("ffmpeg").
      - name: Install ffmpeg
        run: brew install ffmpeg

      # On macOS arm64 the default torch/onnxruntime wheels are CPU/MPS,
      # so no CUDA extra is installed. Do NOT add a [gpu] extra here:
      # it would pull the multi-gigabyte CUDA stack that only exists on Linux.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 audio-separator soundfile pytest pytest-qt pyinstaller

      - name: Run tests (offscreen, fast only)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m "not slow" -q

      - name: Verify translations are up to date
        run: python scripts/build_translations.py --check

      - name: Build the .app with PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/stem-separator.spec

      - name: Smoke test the bundled binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/StemSeparator.app/Contents/MacOS/StemSeparator --help

      - name: Package the .app as a zip
        working-directory: dist
        run: ditto -c -k --sequesterRsrc --keepParent StemSeparator.app StemSeparator-macos.zip

      # GitHub caps individual artifacts (currently ~2 GB zipped). If the zip
      # ever exceeds that limit, fall back to publishing the archive as a
      # GitHub Release asset (gh release upload <tag> dist/StemSeparator-macos.zip)
      # and keep only a small pointer/checksum as the artifact.
      - name: Upload the macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StemSeparator-macos
          path: dist/StemSeparator-macos.zip
